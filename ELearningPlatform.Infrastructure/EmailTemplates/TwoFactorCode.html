<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Two-Factor Authentication</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f6fa; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h2 style="color: #2c3e50;">Hello {name},</h2>
        <p style="font-size: 16px; color: #333333;">
            Your <b>Two-Factor Authentication</b> code is:
        </p>
        <div style="font-size: 24px; font-weight: bold; color: #e74c3c; text-align: center; margin: 20px 0;">
            {code}
        </div>
        <p style="font-size: 14px; color: #555555;">
            This code will expire in 5 minutes. If you did not request this code, please ignore this email.
        </p>
        <p style="font-size: 14px; color: #555555;">
            Thanks,<br>
            <b>E-Learning Platform Team</b>
        </p>
    </div>
</body>
</html>
